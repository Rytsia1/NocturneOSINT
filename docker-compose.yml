services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nocturne}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nocturne}
      POSTGRES_DB: ${POSTGRES_DB:-nocturne}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # TCP (-h 127.0.0.1), not the unix socket: the image's temporary init
      # server only listens on the socket, so a socket check reports ready
      # before PostGIS init finishes and the real server starts.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-nocturne} -d ${POSTGRES_DB:-nocturne}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./backend/migrations:/migrations:ro
    entrypoint:
      - migrate
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-nocturne}:${POSTGRES_PASSWORD:-nocturne}@postgres:5432/${POSTGRES_DB:-nocturne}?sslmode=disable
    command: ["up"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      PORT: 8080
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER:-nocturne}:${POSTGRES_PASSWORD:-nocturne}@postgres:5432/${POSTGRES_DB:-nocturne}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
